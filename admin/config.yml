backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "webshop_data"
    label: "Webshop Adatok"
    files:
      - label: "Kezdőlap Bannerek (Lakossági & Üzleti)"
        name: "banners"
        file: "api/banners.json"
        fields:
          - label: "Lakossági (B2C) Bannerek"
            name: "items"
            widget: "list"
            fields:
              - {label: "Főcím (H2)", name: "title", widget: "string", required: false}
              - {label: "Alcím", name: "subtitle", widget: "string", required: false}
              - {label: "Háttérkép", name: "image", widget: "image"}
              - {label: "Kép SEO leírása (Alt)", name: "alt_text", widget: "string", required: false}
              - {label: "Gomb felirata", name: "btn_text", widget: "string", required: false}
              - {label: "Gomb Linkje (URL vagy kategória: konyves, lego, szezon, gyerek, egyutt, egyedi-b2c)", name: "btn_link", widget: "string", required: false}
          - label: "Üzleti (B2B) Bannerek"
            name: "b2b_items"
            widget: "list"
            fields:
              - {label: "Főcím (H2)", name: "title", widget: "string", required: false}
              - {label: "Alcím", name: "subtitle", widget: "string", required: false}
              - {label: "Háttérkép", name: "image", widget: "image"}
              - {label: "Kép SEO leírása (Alt)", name: "alt_text", widget: "string", required: false}
              - {label: "Gomb felirata", name: "btn_text", widget: "string", required: false}
              - {label: "Gomb Linkje (URL vagy kategória: it, rendszerezo, bernyomtatas, egyedi-b2b)", name: "btn_link", widget: "string", required: false}

      - label: "Bemutatkozó Z-Blokkok (Kezdőlap)"
        name: "home_sections"
        file: "api/home_sections.json"
        fields:
          - label: "Lakossági (B2C) Z-Szekciók"
            name: "items"
            widget: "list"
            fields:
              - {label: "Címsor (H2)", name: "title", widget: "string"}
              - {label: "Szöveg", name: "text", widget: "text"}
              - {label: "Kép", name: "image", widget: "image", required: false}
              - {label: "Kép SEO leírása (Alt)", name: "alt_text", widget: "string", required: false}
          - label: "Üzleti (B2B) Z-Szekciók"
            name: "b2b_items"
            widget: "list"
            fields:
              - {label: "Címsor (H2)", name: "title", widget: "string"}
              - {label: "Szöveg", name: "text", widget: "text"}
              - {label: "Kép", name: "image", widget: "image", required: false}
              - {label: "Kép SEO leírása (Alt)", name: "alt_text", widget: "string", required: false}

      - label: "Terméktörzs"
        name: "products"
        file: "api/products.json"
        fields:
          - label: "Termékek"
            name: "items"
            widget: "list"
            fields:
              - {label: "Termék neve", name: "title", widget: "string"}
              - {label: "Főmenü (Kategória)", name: "category", widget: "select", options: ["Könyves kiegészítők", "LEGO szerelmeseinek", "Szezonális & Ünnepi dekor", "Gyerekeknek", "Együttműködések", "IT kiegészítők", "Rendszerezők", "Bérnyomtatás"]}
              - {label: "Alkategória", name: "subcategory", widget: "string", required: false}
              - {label: "Ár (Ft)", name: "price", widget: "number"}
              - {label: "Főkép (Borítókép)", name: "image", widget: "image"}
              - label: "További képek (Galéria)"
                name: "gallery"
                widget: "list"
                required: false
                field: {label: "Kép", name: "image", widget: "image"}
              - {label: "Termékvideó (MP4 fájl)", name: "video", widget: "file", required: false}
              - {label: "SEO helyettesítő szöveg (Alt)", name: "alt_text", widget: "string", hint: "Pl.: Saját gyártású 3D nyomtatott könyvtámasz", required: false}
              - {label: "Leírás", name: "desc", widget: "text", required: false}
              - {label: "Választható opciók (Vesszővel elválasztva)", name: "options", widget: "string", required: false}
              - {label: "Kérhet a vevő egyedi megjegyzést?", name: "allow_comment", widget: "boolean", default: false, required: false}
